# S6 §7's automation, as the thing that actually runs it. The same chain this machine runs
# (scripts/verify-all.sh) plus the two steps that need a network or a signing-free build; the device
# half stays manual and lives in docs/device-run.md, because no runner has a phone or a Mac's Squirrel.
#
# Use the same Xcode release as local verification rather than the runner image's default.
name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          swift --version
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-path

      - name: Engine tests, status, wiring, links, repository and type-check
        run: ./scripts/verify-all.sh

      - name: Release bundle check on an unsigned build
        run: |
          # -scheme, not -target: Xcode refuses -derivedDataPath without one ("The flag -scheme,
          # -testProductsPath, or -xctestrun is required"), so the first version of this step could never
          # have run. The scheme's build action is the app alone, which is what this needs (round 157).
          xcodebuild -project arkey.xcodeproj -scheme arkey -configuration Release \
            -sdk iphoneos -derivedDataPath .build/ci-derived \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          ./scripts/check-release-bundle.sh \
            .build/ci-derived/Build/Products/Release-iphoneos/arkey.app

      - name: The checks themselves (each one must fail when its subject is broken)
        run: |
          ./scripts/check-verification-scripts.sh \
            .build/ci-derived/Build/Products/Release-iphoneos/arkey.app

      - name: Catalogue pages and licence links (needs the network)
        run: ./scripts/check-catalog-pages.sh
